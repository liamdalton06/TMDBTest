<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>moviebrowser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="head">
        <div class="home-heading">
            <h1>Movie browser</h1>
            <a class="account-link" href="login.html">

                <svg 
                     xmlns="http://www.w3.org/2000/svg" 
                     width="24" height="24" 
                     viewBox="0 0 24 24" 
                     fill="none" 
                     stroke="currentColor" 
                     stroke-width="2" 
                     stroke-linecap="round" 
                     stroke-linejoin="round" 
                     class="lucide lucide-square-user-round preview-icon">
                
                    <path d="M18 21a6 6 0 0 0-12 0" />
                    <circle cx="12" cy="11" r="4" />
                    <rect width="18" height="18" x="3" y="3" rx="2" />
                </svg>
                <div class="account-link-text">
                     Sign in
                </div>
            </a>
        </div>

        <form class="search-form" id="search-form">
            <label for="usersearch">Search for a movie:</label>
            <div class="search-controls">
                <input class="search-bar" type="search" id="usersearch" autocomplete="off" />
                <button class="search-btn" type="submit">Search</button>
            </div>
        </form>
    </header>

    <main>
        <p class="status-message" id="search-status" role="status" aria-live="polite"></p>
        <div class="results-heading" id="results-heading" hidden>
            <h2 id="results-title">Top rated movies</h2>
        </div>
        <div id="results"></div>
    </main>

    <script src="search.js"></script>
</body>
</html>
